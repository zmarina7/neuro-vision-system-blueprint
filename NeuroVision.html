<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuro-Vision | Tactical AI HUD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #050505; color: #00ff41; font-family: 'Courier New', monospace; overflow: hidden; }
        .radar-circle {
            width: 300px; height: 300px; border: 2px solid #00441b; border-radius: 50%;
            position: relative; overflow: hidden; background: radial-gradient(circle, #00220d 0%, #050505 70%);
        }
        .radar-sweep {
            position: absolute; width: 50%; height: 50%; top: 50%; left: 50%;
            background: linear-gradient(0deg, rgba(0,255,65,0.2) 0%, transparent 100%);
            transform-origin: top left; animation: sweep 4s linear infinite;
        }
        @keyframes sweep { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .blip { position: absolute; width: 10px; height: 10px; background: #ff3333; border-radius: 50%; box-shadow: 0 0 10px #ff3333; opacity: 0; }
        .glitch-text { animation: blink 1s steps(2, start) infinite; }
        @keyframes blink { to { visibility: hidden; } }
        .terminal { background: rgba(0, 20, 0, 0.8); border: 1px solid #00ff41; height: 200px; overflow-y: auto; padding: 10px; font-size: 12px; }
    </style>
</head>
<body class="flex flex-col items-center justify-center h-screen p-4">

    <!-- HUD Header -->
    <div class="w-full max-w-md flex justify-between mb-4 border-b border-green-900 pb-2">
        <div>MODE: <span class="text-white">TACTICAL_STEALTH</span></div>
        <div class="glitch-text">REC: 1550nm</div>
    </div>

    <!-- Radar UI -->
    <div class="radar-circle mb-8">
        <div class="radar-sweep"></div>
        <div id="blipContainer"></div>
        <!-- Center point -->
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-2 h-2 bg-white rounded-full"></div>
    </div>

    <!-- Live AI Feed -->
    <div class="w-full max-w-md space-y-4">
        <div class="grid grid-cols-2 gap-2 text-xs">
            <div class="p-2 border border-green-900 bg-green-950/20">
                AI CLASSIFICATION:<br><span id="objName" class="text-white text-sm">SCANNING...</span>
            </div>
            <div class="p-2 border border-green-900 bg-green-950/20">
                DIST / PRIORITY:<br><span id="objDist" class="text-white text-sm">0.0m</span>
            </div>
        </div>

        <div id="alertBox" class="p-3 text-center font-bold border-2 border-green-900">
            SYSTEM READY
        </div>

        <div class="terminal" id="terminalLog">
            [BOOT] Neuro-Vision Neural Core v2.0...<br>
            [BOOT] 1550nm LiDAR Stealth Mode Active...<br>
            [BOOT] Initializing BCI Bridge...<br>
        </div>
    </div>

    <script>
        const objects = [
            { name: "MOVING VEHICLE", weight: 10, color: "#ff3333" },
            { name: "PEDESTRIAN", weight: 8, color: "#ffff33" },
            { name: "STAIRS (DOWN)", weight: 9, color: "#ff3333" },
            { name: "TRAFFIC LIGHT (RED)", weight: 7, color: "#ff3333" },
            { name: "WALL / OBSTACLE", weight: 3, color: "#00ff41" }
        ];

        function runScan() {
            const obj = objects[Math.floor(Math.random() * objects.length)];
            const dist = (Math.random() * 5 + 0.5).toFixed(2);
            const priority = (obj.weight / (dist * dist)).toFixed(2);

            // Update UI
            document.getElementById('objName').innerText = obj.name;
            document.getElementById('objDist').innerText = `${dist}m / ${priority}`;
            
            const alertBox = document.getElementById('alertBox');
            const log = document.getElementById('terminalLog');
            const newLog = document.createElement('div');

            if (priority > 10) {
                alertBox.className = "p-3 text-center font-bold border-2 border-red-600 bg-red-950 text-red-500 animate-pulse";
                alertBox.innerText = "🚨 CRITICAL: HAPTIC PULSE SENT";
                newLog.innerHTML = `[!] THREAT DETECTED: ${obj.name} at ${dist}m. Pulse Sent.`;
            } else if (priority > 3) {
                alertBox.className = "p-3 text-center font-bold border-2 border-yellow-600 bg-yellow-950 text-yellow-500";
                alertBox.innerText = "⚠️ WARNING: GENTLE NUDGE";
                newLog.innerHTML = `[*] Caution: ${obj.name} near. Nudging user.`;
            } else {
                alertBox.className = "p-3 text-center font-bold border-2 border-green-900 text-green-500";
                alertBox.innerText = "PATH CLEAR";
                newLog.innerHTML = `[+] Path scanned: ${obj.name} at safe distance.`;
            }

            log.prepend(newLog);
            createBlip(dist, obj.color);
        }

        function createBlip(dist, color) {
            const container = document.getElementById('blipContainer');
            const blip = document.createElement('div');
            blip.className = 'blip';
            
            // Map distance to radar radius (0-150px)
            const radius = (dist / 6) * 150;
            const angle = Math.random() * Math.PI * 2;
            const x = 150 + radius * Math.cos(angle);
            const y = 150 + radius * Math.sin(angle);

            blip.style.left = `${x}px`;
            blip.style.top = `${y}px`;
            blip.style.background = color;
            blip.style.boxShadow = `0 0 10px ${color}`;
            blip.style.opacity = "1";
            
            container.appendChild(blip);
            setTimeout(() => blip.remove(), 2000);
        }

        setInterval(runScan, 3000);
    </script>
</body>
</html>
